<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لوحة معلومات الاحتياط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A2E; --paper:#F7F5F0; --card:#FFFFFF;
    --teal:#0E4F4F; --teal-deep:#0A3B3B; --line:#DDD8CC; --muted:#6B7674;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); font-family:'Tajawal',sans-serif; color:var(--ink);
    min-height:100vh; padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 40px;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:22px; font-weight:800; color:var(--teal-deep); margin:0 0 20px;}
  #gate{max-width:340px; margin:60px auto; text-align:center;}
  #gate input{width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:3px; text-align:center; letter-spacing:4px;}
  #gate button{width:100%; margin-top:10px; background:var(--teal); color:#fff; border:none; padding:12px; border-radius:3px; font-family:'Tajawal',sans-serif; font-weight:700; cursor:pointer;}
  #gate .err{color:#A13E3E; font-size:13px; margin-top:8px;}
  #app{display:none;}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:24px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px;}
  .kpi .num{font-size:28px; font-weight:800; color:var(--teal);}
  .kpi .lbl{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .section{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:18px; margin-bottom:20px;}
  .section h2{font-size:15px; font-weight:800; color:var(--teal-deep); margin:0 0 12px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{padding:8px 9px; border-bottom:1px solid var(--line); text-align:right;}
  th{background:#EFEEE7; color:var(--teal-deep); font-weight:700;}
  .export-btn{background:transparent; color:var(--teal); border:1px solid var(--teal); padding:9px 18px;
    font-family:'Tajawal',sans-serif; font-size:13.5px; font-weight:700; border-radius:3px; cursor:pointer; margin-bottom:14px;}
  .table-wrap{overflow-x:auto;}
  .empty{color:var(--muted); text-align:center; padding:20px; font-size:13px;}
  .edu-header{ background:#15445A; border-radius:6px 6px 0 0; padding:16px 20px 22px; margin:0 0 34px; position:relative; overflow:visible; }
  .edu-header-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .edu-dept{ color:#fff; font-weight:700; font-size:14px; line-height:1.6; text-align:right; }
  .edu-divider{ width:1px; align-self:stretch; background:rgba(255,255,255,.35); margin:0 4px; }
  .edu-logo{ height:44px; flex-shrink:0; }
  .edu-gradient{ height:6px; margin:14px -20px -22px; background:linear-gradient(90deg,#2A85B8,#389D9C,#4AB87C); border-radius:0 0 6px 6px; }
  .edu-school{ position:relative; margin:-14px auto 0; max-width:88%; background:#fff; border:2px solid #15445A; color:#15445A; font-weight:800; font-size:13.5px; text-align:center; padding:7px 14px; border-radius:4px; z-index:2; }
</style>
</head>
<body>
<div id="gate">
  <h1 style="margin-bottom:16px;">دخول الوكيلة</h1>
  <input type="password" id="pinInput" placeholder="رمز الدخول" inputmode="numeric">
  <button id="pinBtn">دخول</button>
  <div class="err" id="pinErr"></div>
</div>

let PIN = sessionStorage.getItem('staffPin') || '';

async function tryLoad(pin){
  const res = await fetch('/api/summary?pin=' + encodeURIComponent(pin));
  if(!res.ok) return false;
  PIN = pin;
  sessionStorage.setItem('staffPin', pin);
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadAll();
  return true;
}

document.getElementById('pinBtn').addEventListener('click', async ()=>{
  const pin = document.getElementById('pinInput').value;
  const ok = await tryLoad(pin);
  if(!ok) document.getElementById('pinErr').textContent = 'رمز غير صحيح';
});

async function loadAll(){
  const [summary, entries] = await Promise.all([
    fetch('/api/summary?pin=' + encodeURIComponent(PIN)).then(r=>r.json()),
    fetch('/api/entries?pin=' + encodeURIComponent(PIN)).then(r=>r.json())
  ]);
  renderKpis(summary, entries);
  renderByTeacher(summary.by_teacher_month);
  renderEntries(entries);
}

function renderKpis(summary, entries){
  const el = document.getElementById('kpis');
  const notesFollowup = 0; // reserved for future "needs follow-up" flag
  el.innerHTML = `
    <div class="kpi"><div class="num">${summary.today_total}</div><div class="lbl">حصص اليوم المسجّلة</div></div>
    <div class="kpi"><div class="num">${entries.length}</div><div class="lbl">إجمالي الحصص (آخر 500)</div></div>
  `;
}

function renderByTeacher(rows){
  const el = document.getElementById('byTeacher');
  if(!rows.length){ el.innerHTML = '<div class="empty">لا توجد بيانات هذا الشهر بعد.</div>'; return; }
  let html = '<table><thead><tr><th>اسم المعلمة</th><th>عدد الحصص</th></tr></thead><tbody>';
  rows.forEach(r=>{ html += `<tr><td>${r.teacher}</td><td>${r.c}</td></tr>`; });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderEntries(rows){
  const el = document.getElementById('entriesTable');
  if(!rows.length){ el.innerHTML = '<div class="empty">لا توجد حصص مسجّلة بعد.</div>'; return; }
  let html = '<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الحصة</th><th>المعلمة</th><th>ما تم تنفيذه</th><th>الشواهد</th><th>الصورة</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const imgUrl = '/api/image/' + r.id + '?pin=' + encodeURIComponent(PIN);
    const photoCell = r.has_image
      ? `<a href="${imgUrl}" target="_blank"><img src="${imgUrl}" alt="شاهد" style="width:44px;height:44px;object-fit:cover;border-radius:3px;border:1px solid var(--line);"></a>`
      : '—';
    html += `<tr><td>${r.entry_date}</td><td>${r.day}</td><td>${r.period}</td><td>${r.teacher}</td><td>${r.done}</td><td>${r.evidence}</td><td>${photoCell}</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  window.location.href = '/api/export?pin=' + encodeURIComponent(PIN);
});

if(PIN){ tryLoad(PIN); }
</script>
</body>
</html>
