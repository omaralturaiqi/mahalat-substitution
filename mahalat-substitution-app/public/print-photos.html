<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة شواهد حصص الاحتياط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1B2A2E; --paper:#F7F5F0; --card:#FFFFFF; --teal:#0E4F4F; --teal-deep:#0A3B3B; --line:#DDD8CC; --muted:#6B7674; }
  *{box-sizing:border-box;}
  body{background:var(--paper); font-family:'Tajawal',sans-serif; color:var(--ink); margin:0; padding:24px;}
  .toolbar{max-width:900px; margin:0 auto 20px; display:flex; justify-content:space-between; align-items:center;}
  h1{font-size:19px; font-weight:800; color:var(--teal-deep); margin:0;}
  button{background:var(--teal); color:#fff; border:none; padding:10px 18px; border-radius:3px; font-family:'Tajawal',sans-serif; font-weight:700; cursor:pointer;}
  #gate{max-width:320px; margin:60px auto; text-align:center;}
  #gate input{width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:3px; text-align:center; letter-spacing:4px;}
  #gate button{width:100%; margin-top:10px;}
  #gate .err{color:#A13E3E; font-size:13px; margin-top:8px;}
  #sheet{display:none;}
  .grid{max-width:900px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:14px; break-inside:avoid;}
  .card img{width:100%; height:220px; object-fit:cover; border-radius:3px; border:1px solid var(--line); margin-bottom:10px;}
  .cap{font-size:12.5px; line-height:1.7;}
  .cap b{color:var(--teal-deep);}
  .empty{max-width:900px; margin:40px auto; text-align:center; color:var(--muted);}
  @media print{
    .toolbar, #gate{display:none;}
    body{padding:0; background:#fff;}
    .grid{max-width:100%; gap:12px;}
    .card{box-shadow:none;}
  }
  .edu-header{ background:#15445A; border-radius:6px 6px 0 0; padding:16px 20px 22px; margin:0 0 34px; position:relative; overflow:visible; }
  .edu-header-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .edu-dept{ color:#fff; font-weight:700; font-size:14px; line-height:1.6; text-align:right; }
  .edu-divider{ width:1px; align-self:stretch; background:rgba(255,255,255,.35); margin:0 4px; }
  .edu-logo{ height:44px; flex-shrink:0; }
  .edu-gradient{ height:6px; margin:14px -20px -22px; background:linear-gradient(90deg,#2A85B8,#389D9C,#4AB87C); border-radius:0 0 6px 6px; }
  .edu-school{ margin:0 auto 20px; max-width:88%; background:#fff; border:2px solid #15445A; color:#15445A; font-weight:800; font-size:14px; text-align:center; padding:9px 14px; border-radius:4px; }
.edu-header, .edu-school{ max-width:900px; margin-left:auto; margin-right:auto; }
  .edu-credit{ text-align:center; font-size:11.5px; color:#6B7674; margin:0 0 22px; }
</style>
</head>
<body>
<div id="gate">
  <h1 style="margin-bottom:16px;">دخول الوكيلة</h1>
  <input type="password" id="pinInput" placeholder="رمز الدخول" inputmode="numeric">
  <button id="pinBtn">دخول</button>
  <div class="err" id="pinErr"></div>
</div>

<div id="sheet">
  <div class="edu-school">الابتدائية السابعة والروضة الملحقة</div>
  <div class="edu-credit">تنفيذ: وكيلة المدرسة نوف الصالح &nbsp;|&nbsp; مديرة المدرسة: مشاعل الزغيبي</div>
  <div class="toolbar">
    <h1>شواهد حصص الاحتياط — للطباعة</h1>
    <button onclick="window.print()">طباعة</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">لا توجد صور شواهد مسجّلة بعد.</div>
</div>

<script>
let PIN = sessionStorage.getItem('staffPin') || '';

async function tryLoad(pin){
  const res = await fetch('/api/summary?pin=' + encodeURIComponent(pin));
  if(!res.ok) return false;
  PIN = pin;
  sessionStorage.setItem('staffPin', pin);
  document.getElementById('gate').style.display = 'none';
  document.getElementById('sheet').style.display = 'block';
  await load();
  return true;
}

document.getElementById('pinBtn').addEventListener('click', async ()=>{
  const pin = document.getElementById('pinInput').value;
  const ok = await tryLoad(pin);
  if(!ok) document.getElementById('pinErr').textContent = 'رمز غير صحيح';
});

async function load(){
  const rows = await fetch('/api/entries?pin=' + encodeURIComponent(PIN)).then(r=>r.json());
  const withPhotos = rows.filter(r => r.has_image);
  const grid = document.getElementById('grid');
  if(!withPhotos.length){
    document.getElementById('empty').style.display = 'block';
    return;
  }
  grid.innerHTML = withPhotos.map(r => `
    <div class="card">
      <img src="/api/image/${r.id}?pin=${encodeURIComponent(PIN)}" alt="شاهد">
      <div class="cap">
        <b>المعلمة:</b> ${r.teacher}<br>
        <b>التاريخ:</b> ${r.entry_date} (${r.day}) — <b>الحصة:</b> ${r.period}<br>
        <b>ما تم تنفيذه:</b> ${r.done}<br>
        <b>الشاهد:</b> ${r.evidence}
      </div>
    </div>
  `).join('');
}

if(PIN){ tryLoad(PIN); }
</script>
</body>
</html>
